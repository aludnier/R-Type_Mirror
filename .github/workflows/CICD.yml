name: CICD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
      - Dev
  workflow_dispatch:

env:
  EPITECH_REPO: "git@github.com:EpitechPGE3-2026/G-ING-500-PAR-5-1-rtype-12.git"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  warmup:
    uses: ./.github/workflows/warmup-vcpkg.yml

  build-game:
    needs: warmup
    uses: ./.github/workflows/build-game.yml

  build-engine:
    needs: warmup
    uses: ./.github/workflows/build-engine.yml

  linter:
    name: "CPP Linter"
    needs: warmup
    uses: ./.github/workflows/linter.yml
    permissions:
      contents: write
      pull-requests: write

  push-to-mirror:
    needs: [ build-game , build-engine , linter ]
    if: github.repository == 'aludnier/R-Type_Mirror'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: "actions/checkout@v7"
        with:
          fetch-depth: 0
      - name: Push to Epitech Repository
        uses: pixta-dev/repository-mirroring-action@v1
        with:
          target_repo_url: ${{ env.EPITECH_REPO }}
          ssh_private_key: ${{ secrets.SSH_PRIVATE_KEY }}
