site_name: R-Type documentation
site_description: Developer documentation of the R-Type game and its engine
site_url: https://aludnier.github.io/R-Type_Mirror/
repo_url: https://github.com/aludnier/R-Type_Mirror
repo_name: aludnier/R-Type_Mirror
edit_uri: blob/main/docs/
docs_dir: docs

nav:
  - Home: index.md
  - Architecture:
      - Overview: architecture/README.md
      - Diagrams: architecture/diagrams.md
  - Network protocol: protocol.md
  - Engine:
      - Dynamic modules: writing_dynamic_modules.md
      - Lua scripting: scripting.md
      - UI documents: ui.md
  - Comparative study: comparative_study.md
  - Accessibility: accessibility.md
  - Contributing: contributing.md

theme:
  name: material
  language: en
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

plugins:
  - search
  - include-markdown

hooks:
  - mkdocs_hooks.py

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - plantuml_markdown:
      # Empty: render with the local `plantuml` command (installed by the
      # docs workflow). Set PLANTUML_SERVER to use a PlantUML server instead.
      server: !ENV [PLANTUML_SERVER, ""]
      base_dir: docs/architecture
      format: svg_inline
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences

validation:
  links:
    anchors: warn
